name: Generate OLDS RSS

on:
  schedule:
    # 30分ごとに自動実行
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: ライブラリのインストール
        run: |
          pip install requests beautifulsoup4 feedgen

      - name: スクレイピングの実行
        run: python main.py

      - name: 生成したRSS（olds.xml）をコミットして保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add olds.xml
          git commit -m "Update RSS feed" || exit 0
          git push
